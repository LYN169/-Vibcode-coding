services:
  - type: web
    name: regional-potential-lab
    runtime: python
    repo: https://github.com/LYN169/-Vibcode-coding.git
    branch: main
    region: singapore
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pip install -r requirements-spatial.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
